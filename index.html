<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ElectroSafe - Monitor EMF</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --safe: #10b981;
      --caution: #f59e0b;
      --danger: #f97316;
      --critical: #ef4444;
      --ble-blue: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* Encabezado */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 1.2rem;
      font-weight: 700;
    }

    .ble-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: var(--ble-blue);
      color: #ffffff;
      border: none;
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
    }

    .ble-btn.connected {
      background-color: rgba(16, 185, 129, 0.2);
      color: var(--safe);
      border: 1px solid var(--safe);
      box-shadow: none;
    }

    .dot {
      width: 8px;
      height: 8px;
      background-color: #ffffff;
      border-radius: 50%;
    }

    .ble-btn.connected .dot {
      background-color: var(--safe);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    /* Banner de Riesgo */
    .risk-banner {
      background-color: var(--safe);
      color: #ffffff;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-bottom: 16px;
      transition: background-color 0.4s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .risk-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.9;
    }

    .risk-title {
      font-size: 1.8rem;
      font-weight: 800;
      margin: 4px 0;
    }

    .risk-desc {
      font-size: 0.85rem;
      opacity: 0.95;
    }

    /* Tarjetas de Sensores */
    .grid-sensors {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .sensor-name {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .sensor-value {
      font-size: 1.7rem;
      font-weight: 700;
    }

    .sensor-unit {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .progress-bg {
      width: 100%;
      height: 8px;
      background-color: #0f172a;
      border-radius: 4px;
      margin-top: 12px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 10%;
      background-color: var(--safe);
      transition: width 0.3s ease, background-color 0.3s ease;
    }

    /* Frecuencia y Pico */
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      margin-bottom: 16px;
    }

    .info-row span:first-child {
      color: var(--text-muted);
    }

    /* Botones de Acción */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .action-btn {
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .action-btn:active {
      transform: scale(0.97);
    }

    .btn-calibrate {
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid #334155;
    }

    .btn-save {
      background-color: #3b82f6;
      color: white;
    }

    /* Barra de herramientas del historial */
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 8px;
    }

    .history-title {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .history-tools {
      display: flex;
      gap: 6px;
    }

    .tool-btn {
      border: none;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-export {
      background-color: rgba(16, 185, 129, 0.2);
      color: var(--safe);
      border: 1px solid var(--safe);
    }

    .btn-clear {
      background-color: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 240px;
      overflow-y: auto;
    }

    .history-item {
      background-color: var(--card-bg);
      padding: 10px 14px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      border-left: 4px solid var(--safe);
    }

    .empty-msg {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      padding: 18px;
      background-color: var(--card-bg);
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">⚡ ElectroSafe</div>
    <button class="ble-btn" id="btnBle" onclick="gestionarBluetooth()">
      <div class="dot"></div>
      <span id="bleText">Conectar ESP32</span>
    </button>
  </header>

  <!-- Banner de Nivel de Riesgo -->
  <div class="risk-banner" id="riskBanner">
    <div class="risk-label" id="modeLabel">MODO SIMULACIÓN</div>
    <div class="risk-title" id="riskTitle">BAJO RIESGO</div>
    <div class="risk-desc" id="riskDesc">Valores dentro de los límites seguros (ICNIRP)</div>
  </div>

  <!-- Medidores Principales -->
  <div class="grid-sensors">
    <div class="card">
      <div class="sensor-name">Campo Eléctrico (E)</div>
      <div>
        <span class="sensor-value" id="valE">0.0</span>
        <span class="sensor-unit">V/m</span>
      </div>
      <div class="progress-bg">
        <div class="progress-fill" id="barE"></div>
      </div>
    </div>

    <div class="card">
      <div class="sensor-name">Campo Magnético (B)</div>
      <div>
        <span class="sensor-value" id="valB">0.0</span>
        <span class="sensor-unit">µT</span>
      </div>
      <div class="progress-bg">
        <div class="progress-fill" id="barB"></div>
      </div>
    </div>
  </div>

  <!-- Datos secundarios -->
  <div class="card info-row">
    <div>
      <span>Frecuencia: </span>
      <strong id="valFreq">60.0 Hz</strong>
    </div>
    <div>
      <span>Pico máx: </span>
      <strong id="valPeak">0.0 µT</strong>
    </div>
  </div>

  <!-- Botones -->
  <div class="actions">
    <button class="action-btn btn-calibrate" onclick="calibrarSensor()">🎯 Calibrar (Tara)</button>
    <button class="action-btn btn-save" onclick="guardarLectura()">💾 Guardar Punto</button>
  </div>

  <!-- Cabecera del Historial con Descarga y Borrado -->
  <div class="history-header">
    <div class="history-title">
      Historial (<span id="countSaved">0</span>)
    </div>
    <div class="history-tools">
      <button class="tool-btn btn-export" onclick="exportarCSV()">📥 Excel (CSV)</button>
      <button class="tool-btn btn-clear" onclick="limpiarHistorial()">🗑️ Borrar</button>
    </div>
  </div>

  <div class="history-list" id="historyList"></div>

  <script>
    // === CONFIGURACIÓN BLUETOOTH ===
    const DEVICE_NAME = "ElectroSafe_ESP32";
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
    const STORAGE_KEY = "electrosafe_registros_v1";

    let bleDevice = null;
    let isConnected = false;
    let simInterval = null;

    // Variables de medición
    let offsetE = 0;
    let offsetB = 0;
    let rawE = 0;
    let rawB = 0;
    let peakB = 0;

    // Cargar registros guardados previamente en el teléfono
    let registros = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

    // === CONEXIÓN WEB BLUETOOTH ===
    async function gestionarBluetooth() {
      if (isConnected && bleDevice) {
        bleDevice.gatt.disconnect();
        return;
      }

      if (!navigator.bluetooth) {
        alert("Tu navegador no soporta Web Bluetooth. Ábrelo desde Google Chrome en Android.");
        return;
      }

      try {
        document.getElementById('bleText').innerText = "Buscando...";

        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: DEVICE_NAME }],
          optionalServices: [SERVICE_UUID]
        });

        bleDevice.addEventListener('gattserverdisconnected', alDesconectar);

        const server = await bleDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        const characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        await characteristic.startNotifications();
        characteristic.addEventListener('characteristicvaluechanged', manejarDatosBLE);

        isConnected = true;
        clearInterval(simInterval);
        peakB = 0;

        const btn = document.getElementById('btnBle');
        btn.classList.add('connected');
        document.getElementById('bleText').innerText = "ESP32 Conectado";
